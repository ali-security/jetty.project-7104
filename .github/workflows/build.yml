name: Jetty CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      MAVEN_OPTS: "-Xms256m -Xmx1024m -Djava.awt.headless=true"
      # The pom.xml profiles that set alpn.version only know about JDK 8
      # builds up to 1.8.0_172. GitHub Actions runners ship a much newer
      # JDK 8, so no profile activates and alpn.version stays as the
      # literal default "undefined", breaking artifact resolution.
      # We pin to the latest known-good version explicitly.
      ALPN_VERSION: "8.1.12.v20180117"
      # Modules to build and test. --also-make (-am) will automatically pull
      # in any upstream dependencies each module requires.
      BUILD_MODULES: "jetty-server,jetty-util,jetty-servlets"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"
          cache: maven

      - name: Compile
        run: |
          # Build everything except jetty-distribution first so all reactor
          # artifacts are installed to the local repo before jetty-distribution
          # tries to copy them (avoids MDEP-187 reactor-artifact ordering error).
          mvn -B clean install -Dtest=None --also-make -pl '${{ env.BUILD_MODULES }},!jetty-distribution' -Dalpn.version=${{ env.ALPN_VERSION }}
          mvn -B install -Dtest=None -pl jetty-distribution -Dalpn.version=${{ env.ALPN_VERSION }}

      - name: Javadoc
        run: mvn -B javadoc:javadoc --also-make -pl '${{ env.BUILD_MODULES }},!jetty-distribution' -Dalpn.version=${{ env.ALPN_VERSION }}

      - name: Test
        id: test
        # jetty-distribution is a pom module with no tests; exclude it so its
        # generate-resources copy goal doesn't re-trigger the MDEP-187 error.
        run: mvn -B test --also-make -pl '${{ env.BUILD_MODULES }}' -Dmaven.test.failure.ignore=true -Dstress=false -Dalpn.version=${{ env.ALPN_VERSION }}
        # run: mvn -B install -Dmaven.test.failure.ignore=true -Dalpn.version=${{ env.ALPN_VERSION }}

      - name: Compact3
        working-directory: aggregates/jetty-all-compact3
        run: mvn -B -Pcompact3 clean install -Dalpn.version=${{ env.ALPN_VERSION }}

      - name: Upload surefire reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: surefire-reports
          path: "**/target/surefire-reports/TEST-*.xml"
          retention-days: 7

      - name: Upload JAR artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jetty-jars-9.3.24.v20180605
          path: |
            **/target/*.jar
            !**/target/*-tests.jar
            !**/target/*-sources.jar
            !**/target/*-javadoc.jar
          retention-days: 14
