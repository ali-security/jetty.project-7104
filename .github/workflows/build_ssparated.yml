name: Jetty CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ubuntu-latest
    
    strategy:
      fail-fast: false # Keeps other jobs running even if one module fails
      matrix:
        include:
          - name: "jetty-server"
          - name: "Jetty-servlets"
          - name: "jetty-utils"

    env:
      MAVEN_OPTS: "-Xms256m -Xmx1024m -Djava.awt.headless=true"
      # The pom.xml profiles that set alpn.version only know about JDK 8
      # builds up to 1.8.0_172. GitHub Actions runners ship a much newer
      # JDK 8, so no profile activates and alpn.version stays as the
      # literal default "undefined", breaking artifact resolution.
      # We pin to the latest known-good version explicitly.
      ALPN_VERSION: "8.1.12.v20180117"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"
          cache: maven

      - name: Pack and test Module
        working-directory: ${{ matrix.name }}
        # The bash shell will resolve $ALPN_VERSION from the env block
        run: "mvn clean package -Dalpn.version=$ALPN_VERSION"

      - name: Upload JAR artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          # Matrix jobs run in parallel. We append the matrix name to 
          # prevent them from overwriting each other's artifacts.
          name: jetty-jars-${{ matrix.name }}-9.3.24.v20180605
          path: |
            ${{ matrix.dir }}/target/*.jar
            !${{ matrix.dir }}/target/*-tests.jar
            !${{ matrix.dir }}/target/*-sources.jar
            !${{ matrix.dir }}/target/*-javadoc.jar
          retention-days: 1